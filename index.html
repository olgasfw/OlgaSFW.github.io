<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, world — olgasfw</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #272522; background-color: #f6f2e9; background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(75,65,50,.018) 4px); font-family: Georgia, serif; }
    .page { width: min(1100px, calc(100% - 48px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; padding: 30px 0 16px; border-bottom: 2px solid #272522; }
    .logo { font: bold 17px Arial, sans-serif; letter-spacing: -.07em; }
    .header-note { font: 11px Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    main { min-height: 75vh; display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; gap: 6%; padding: 48px 0 75px; }
    .eyebrow { font: bold 11px Arial, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
    h1 { position: relative; font-size: clamp(72px, 10vw, 140px); letter-spacing: -.08em; line-height: .9; margin: 32px 0 36px; font-weight: normal; }
    h1 em { display: inline-block; position: relative; font-weight: normal; z-index: 0; }
    h1 em::after { content: ''; position: absolute; height: 12px; background: #f2bd63; left: -2%; right: -4%; bottom: 0; transform: rotate(-2deg); z-index: -1; border-radius: 50% 12% 45% 10%; }
    .intro { max-width: 390px; font: 19px/1.55 Arial, sans-serif; }
    .little-note { margin-top: 55px; font: italic 17px/1.4 Georgia, serif; color: #80543c; transform: rotate(-2deg); }
    .art { min-height: 400px; display: grid; place-items: center; position: relative; background: #e8dfcf; border: 1px solid #d2c5b2; transform: rotate(1.5deg); overflow: hidden; }
    .art::before { content: ''; position: absolute; inset: 20px; border: 1px solid #9e8f7b; transform: rotate(-2deg); }
    .art-letter { color: #7c3c31; font: italic 290px/.8 Georgia, serif; transform: rotate(-9deg); }
    .art-caption { position: absolute; right: 24px; bottom: 24px; font: 11px Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    footer { border-top: 1px solid #272522; display: flex; justify-content: space-between; gap: 20px; padding: 22px 0 35px; font: 11px Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    @media (max-width: 700px) { .page { width: calc(100% - 36px); } main { grid-template-columns: 1fr; gap: 35px; padding: 42px 0 65px; } .art { min-height: 320px; } .art-letter { font-size: 230px; } .little-note { margin-top: 35px; } footer { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="page">
    <header><div class="logo">olgasfw.</div><div class="header-note">Digital Product Designer</div></header>
    <main>
      <section><p class="eyebrow">Simplicity · Function · Wonder</p><h1>Hello,<br><em>world.</em></h1><p class="intro">Welcome to my little corner of the internet. Something thoughtful is taking shape here.</p><p class="little-note">Made with curiosity &amp; care. ↗</p></section>
      <div class="art" aria-hidden="true"><span class="art-letter">O</span><span class="art-caption">A work in progress / No. 01</span></div>
    </main>
    <footer><span>© 2026 olgasfw. All rights reserved.</span></footer>
  </div>
</body>
</html>
